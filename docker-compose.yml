services:
  db:
    image: postgres:16-alpine
    container_name: vulntrack-db
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vulntrack-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vulntrack-net

  redis:
    image: redis:7-alpine
    container_name: vulntrack-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - vulntrack-redis-data:/data
#    ports:
#      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vulntrack-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vulntrack-api:0.5.0
    container_name: vulntrack-api
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      API_KEYS: ${API_KEYS}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: ${ENVIRONMENT}
      REPORT_STORAGE_PATH: /data/reports

    ports:
      - "8001:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vulntrack-net
    volumes:
      - vulntrack-reports:/data/reports

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: vulntrack-api:0.5.0
    command: ["python", "worker.py"]
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from app.queue import redis_conn; redis_conn.ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REPORT_STORAGE_PATH: /data/reports
      API_KEYS: ${API_KEYS}
      ENVIRONMENT: ${ENVIRONMENT}
    volumes:
      - vulntrack-reports:/data/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vulntrack-net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulntrack-net


volumes:
  vulntrack-data:
  vulntrack-redis-data:
  vulntrack-reports:

networks:
  vulntrack-net:
