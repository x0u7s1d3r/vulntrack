services:
  db:
    image: postgres:16-alpine
    container_name: vulntrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vulntrack-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vulntrack-net

  redis:
    image: redis:7-alpine
    container_name: vulntrack-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - vulntrack-redis-data:/data
#    ports:
#      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vulntrack-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vulntrack-api:0.3.0
    container_name: vulntrack-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      API_KEYS: ${API_KEYS}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: ${ENVIRONMENT}
      
      
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vulntrack-net

volumes:
  vulntrack-data:
  vulntrack-redis-data:

networks:
  vulntrack-net:
