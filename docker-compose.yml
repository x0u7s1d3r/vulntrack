services:
  db:
    image: postgres:16-alpine
    container_name: vulntrack-db
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vulntrack-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vulntrack-net

  redis:
    image: redis:7-alpine
    container_name: vulntrack-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - vulntrack-redis-data:/data
#    ports:
#      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vulntrack-net

  traefik:
    image: traefik:v3.3
    container_name: vulntrack-traefik
    restart: unless-stopped
    environment:
      # Le client Docker embarque par Traefik negocie a partir de l'API
      # 1.24 par defaut. Les moteurs Docker recents (>= ~25) refusent toute
      # requete sous leur version minimale supportee avant meme de negocier
      # ("client version 1.24 is too old"). On force donc explicitement une
      # version recente plutot que de laisser le client echouer au demarrage.
      DOCKER_API_VERSION: "1.44"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      # Tableau de bord sans authentification : usage home-lab uniquement.
      # A ne jamais exposer ainsi sur un reseau non maitrise (voir README,
      # section Haute disponibilite / limitations connues).
      - "--api.insecure=true"
    ports:
      - "8001:80"
      - "8090:8080"
    volumes:
      # Necessaire pour que Traefik decouvre les conteneurs api via leurs
      # labels. Un socket Docker monte dans un conteneur equivaut a un acces
      # root sur l'hote : compromis assume pour un home-lab, a durcir avec
      # un proxy comme tecnativa/docker-socket-proxy avant toute prod reelle.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vulntrack-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vulntrack-api:0.5.0
    # Pas de container_name : un nom fixe empeche `docker compose up --scale
    # api=N` de creer plusieurs replicas (deux conteneurs ne peuvent pas
    # porter le meme nom).
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      API_KEYS: ${API_KEYS}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: ${ENVIRONMENT}
      REPORT_STORAGE_PATH: /data/reports
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      # Repartis entre les replicas par Traefik : chaque conteneur peut donc
      # tourner avec moins de workers uvicorn que l'instance unique d'avant
      # (etape 6-7) tout en offrant une capacite totale au moins equivalente.
      # A ajuster selon le nombre de vCPU reellement disponibles sur la VM.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    # Pas de "ports:" ici : seul Traefik est expose sur l'hote. Les
    # conteneurs api restent joignables en interne via le reseau Docker
    # (EXPOSE 8000 dans le Dockerfile), ce que Traefik utilise directement.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      # Healthcheck actif : un replica qui echoue est retire de la rotation
      # sans intervention manuelle, c'est le coeur de la haute disponibilite.
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=10s"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vulntrack-net
    volumes:
      - vulntrack-reports:/data/reports

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: vulntrack-api:0.5.0
    command: ["python", "worker.py"]
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from app.queue import redis_conn; redis_conn.ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REPORT_STORAGE_PATH: /data/reports
      API_KEYS: ${API_KEYS}
      ENVIRONMENT: ${ENVIRONMENT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}

    volumes:
      - vulntrack-reports:/data/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vulntrack-net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulntrack-net


volumes:
  vulntrack-data:
  vulntrack-redis-data:
  vulntrack-reports:

networks:
  vulntrack-net:
