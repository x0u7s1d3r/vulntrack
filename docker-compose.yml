services:
  db:
    image: postgres:16-alpine
    container_name: vulntrack-db
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vulntrack-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vulntrack-net

  redis:
    image: redis:7-alpine
    container_name: vulntrack-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - vulntrack-redis-data:/data
#    ports:
#      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vulntrack-net

  traefik:
    # Version epinglee volontairement : traefik v3.3 fige en dur la version
    # d'API de son client Docker (1.24) et l'API refuse alors de negocier
    # avec un moteur recent ("client version 1.24 is too old"), rendant la
    # decouverte des conteneurs muette. Les v3.7+ negocient correctement la
    # version d'API. Ne pas retrograder sous v3.7 sur un Docker Engine recent.
    image: traefik:v3.7.11
    container_name: vulntrack-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      # Tableau de bord sans authentification : usage home-lab uniquement.
      # A ne jamais exposer ainsi sur un reseau non maitrise (voir README,
      # section Haute disponibilite / limitations connues).
      - "--api.insecure=true"
    ports:
      - "8001:80"
      - "8090:8080"
    volumes:
      # Necessaire pour que Traefik decouvre les conteneurs api via leurs
      # labels. Un socket Docker monte dans un conteneur equivaut a un acces
      # root sur l'hote : compromis assume pour un home-lab, a durcir avec
      # un proxy comme tecnativa/docker-socket-proxy avant toute prod reelle.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vulntrack-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: vulntrack-api:0.5.0
    # Pas de container_name : un nom fixe empeche `docker compose up --scale
    # api=N` de creer plusieurs replicas (deux conteneurs ne peuvent pas
    # porter le meme nom).
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      API_KEYS: ${API_KEYS}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: ${ENVIRONMENT}
      REPORT_STORAGE_PATH: /data/reports
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      # Repartis entre les replicas par Traefik : chaque conteneur peut donc
      # tourner avec moins de workers uvicorn que l'instance unique d'avant
      # (etape 6-7) tout en offrant une capacite totale au moins equivalente.
      # A ajuster selon le nombre de vCPU reellement disponibles sur la VM.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # Active le mode multi-process de prometheus_client : les workers
      # uvicorn agregent leurs metriques via ce repertoire (voir app/metrics.py
      # et Dockerfile). Repertoire local et ephemere, vide au demarrage.
      PROMETHEUS_MULTIPROC_DIR: /data/prometheus
    # Pas de "ports:" ici : seul Traefik est expose sur l'hote. Les
    # conteneurs api restent joignables en interne via le reseau Docker
    # (EXPOSE 8000 dans le Dockerfile), ce que Traefik utilise directement.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      # Healthcheck actif : un replica qui echoue est retire de la rotation
      # sans intervention manuelle, c'est le coeur de la haute disponibilite.
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=10s"
      # Retry : entre le crash d'un replica et sa detection par le
      # healthcheck (jusqu'a 10s), une requete peut encore lui etre routee
      # et tomber sur un refus de connexion. Le middleware la rejoue alors
      # sur un autre replica au lieu de renvoyer une 502/504 au client.
      # Traefik ne rejoue que si aucune reponse n'a encore ete emise : pas
      # de risque de double execution cote serveur.
      - "traefik.http.routers.api.middlewares=api-retry"
      - "traefik.http.middlewares.api-retry.retry.attempts=3"
      - "traefik.http.middlewares.api-retry.retry.initialinterval=100ms"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vulntrack-net
    volumes:
      - vulntrack-reports:/data/reports

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: vulntrack-worker:0.5.0
    command: ["python", "worker.py"]
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from app.queue import redis_conn; redis_conn.ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REPORT_STORAGE_PATH: /data/reports
      API_KEYS: ${API_KEYS}
      ENVIRONMENT: ${ENVIRONMENT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      # Port du serveur de metriques d'etat metier expose par le worker,
      # scrape par Prometheus. Le worker est mono-process, pas de mode
      # multi-process ici (donc pas de PROMETHEUS_MULTIPROC_DIR).
      WORKER_METRICS_PORT: "9100"
      # Notifications (etape 12) : le worker alerte quand un scan produit de
      # nouveaux findings au moins aussi graves que NOTIFY_MIN_SEVERITY.
      # Vides = aucune notification (voir README, section Notifications).
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_MIN_SEVERITY: ${NOTIFY_MIN_SEVERITY:-high}
    volumes:
      - vulntrack-reports:/data/reports
      - vulntrack-trivy-cache:/data/trivy-cache
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vulntrack-net

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: vulntrack-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - vulntrack-prometheus-data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      - worker
    networks:
      - vulntrack-net

  grafana:
    image: grafana/grafana:12.1.0
    container_name: vulntrack-grafana
    restart: unless-stopped
    environment:
      # Identifiants admin de dev. A changer imperativement avant toute
      # exposition reelle (voir README, section Observabilite).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Datasource et dashboard sont provisionnes en code (voir
      # observability/grafana/) : rien a configurer a la main dans l'UI.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - vulntrack-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - vulntrack-net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulntrack-net


  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: vulntrack-api:0.5.0
    command: ["python", "-m", "app.scheduler"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      API_KEYS: ${API_KEYS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vulntrack-net

volumes:
  vulntrack-data:
  vulntrack-redis-data:
  vulntrack-reports:
  vulntrack-trivy-cache:
  vulntrack-prometheus-data:
  vulntrack-grafana-data:

networks:
  vulntrack-net:
