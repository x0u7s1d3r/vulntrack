name: CI Sécurité

on:
  push:
    branches: [ main, securite-ci ]
  pull_request:
    branches: [ main ]

jobs:
  qualite:
    name: Qualité — lint & tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tests (pytest + couverture)
        run: pytest --cov=app --cov-fail-under=85 -q
  sast:
    name: SAST — analyse statique
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les outils SAST
        run: pip install -r requirements-dev.txt

      - name: Semgrep (analyse par règles)
        # --error : fait échouer le build si un finding subsiste (c'est le gate).
        # --exclude-rule : la règle django-no-csrf-token est spécifique à Django
        # et ne s'applique pas à notre pile FastAPI/Jinja (le login-CSRF est
        # traité par un jeton pré-auth, cf. login_submit).
        run: |
          semgrep scan --config auto --error \
            --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token \
            app

      - name: Bandit (SAST Python)
        # -ll : ne remonte que la sévérité moyenne et plus ; sort en erreur si
        # un problème est trouvé → gate.
        run: bandit -r app -ll

  sca:
    name: SCA — dépendances
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer pip-audit
        run: pip install -r requirements-dev.txt

      - name: pip-audit (dépendances de prod)
        # Échoue si une dépendance de requirements.txt a une CVE connue.
        # Le jour où une vuln n'a pas de correctif, on l'ignorera nommément
        # avec --ignore-vuln <ID> (décision de risque documentée).
        run: pip-audit -r requirements.txt

  secrets:
    name: Secrets — Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # indispensable : Gitleaks scanne TOUT l'historique,
                           # pas seulement le dernier commit (clone superficiel par défaut)

      - name: Installer Gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Détection de secrets (historique complet)
        # Lit .gitleaksignore automatiquement ; sort en erreur si une fuite
        # non listée est trouvée → gate.
        run: gitleaks detect --source . --redact -v



  livraison:
    name: Livraison — build & scan de l'image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # requis pour la signature keyless cosign (OIDC)
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build --target runtime -t vulntrack:ci .

      - name: Installer Trivy
        run: |
          VERSION=0.74.0
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin "v${VERSION}"

      - name: Scanner l'image (gate HIGH/CRITICAL corrigeables)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 vulntrack:ci
      - name: Générer le SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json vulntrack:ci

      - name: Publier le SBOM comme artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: sbom-vulntrack
          path: sbom.cdx.json

      - name: Se connecter à GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Taguer et publier l'image sur GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker tag vulntrack:ci $IMAGE:${{ github.sha }}
          docker tag vulntrack:ci $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
      - name: Installer cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
      - name: Signer l'image (keyless, OIDC GitHub Actions)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          echo "Signature de $DIGEST"
          cosign sign --yes "$DIGEST"
