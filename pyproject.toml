[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # Depends() et Form() en valeurs par defaut : pattern officiel FastAPI
    "B008",
    # Longueur de ligne geree par le formateur
    "E501",
    # datetime.UTC : alias 3.11+, timezone.utc reste correct et portable
    "UP017",
    # StrEnum : 3.11+, (str, Enum) reste la forme la plus compatible
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402", "F401"]
