apiVersion: v1
kind: Service
metadata:
  name: {{ include "vulntrack.fullname" . }}-redis
  labels:
    {{- include "vulntrack.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vulntrack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
