apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vulntrack.fullname" . }}-api
  labels:
    {{- include "vulntrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "vulntrack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "vulntrack.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "vulntrack.fullname" . }}-config
            - secretRef:
                name: {{ include "vulntrack.fullname" . }}-app
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOME          # HOME ecrivable (rootfs en lecture seule)
              value: /tmp
          envFrom:
            - configMapRef:
                name: {{ include "vulntrack.fullname" . }}-config
            - secretRef:
                name: {{ include "vulntrack.fullname" . }}-app
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: reports
              mountPath: /data/reports
            - name: prometheus
              mountPath: /data/prometheus
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: {{ include "vulntrack.fullname" . }}-reports
        - name: prometheus
          emptyDir: {}
        - name: tmp
          emptyDir: {}
